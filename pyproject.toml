[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyclip"
version = "0.1.0"
description = "Extract audio clips from YouTube videos by timestamps"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.0",
    "pydub>=0.25.1",
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
pyclip = "clip:main"

[tool.hatch.build.targets.wheel]
include = ["clip.py"]
